services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_local:-asstgr_db}
      POSTGRES_USER: ${DB_USER_local:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD_local:-postgres}
    volumes:
      - asstgr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_local:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST_local: db
      DB_PORT_local: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  asstgr_pgdata: